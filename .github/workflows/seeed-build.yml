name: "Seeed Build"

on:
  workflow_dispatch:
    inputs:
      # ── Boards (multi-select via checkboxes) ─────────────────────────
      board_rk3576:
        description: "Board: reComputer rk3576 DevKit"
        type: boolean
        default: true
      board_rk3588:
        description: "Board: reComputer rk3588 DevKit"
        type: boolean
        default: false

      # ── Releases ──────────────────────────────────────────────────────
      release_trixie:
        description: "Release: Debian 13 (trixie)"
        type: boolean
        default: true
      release_resolute:
        description: "Release: Ubuntu 26.04 (resolute)"
        type: boolean
        default: false

      # ── Tiers ─────────────────────────────────────────────────────────
      tier_cli:
        description: "Tier: cli (no desktop, build.sh --minimal)"
        type: boolean
        default: false
      tier_mid:
        description: "Tier: mid desktop"
        type: boolean
        default: true

      # ── OTA modes (each selected mode becomes a separate matrix entry) ──
      ota_recovery:
        description: "OTA: recovery"
        type: boolean
        default: true
      ota_ab:
        description: "OTA: A/B dual-partition"
        type: boolean
        default: false

      # ── Security profiles (each becomes a separate matrix dimension) ──
      security_plain:
        description: "Security: none (unencrypted images)"
        type: boolean
        default: true
      secure_boot:
        description: "Security: secure-boot (Secure U-Boot + secure-rootfs; requires DEV_CRT + PRIVATE_KEY_PEM secrets)"
        type: boolean
        default: false

      # ── Other options ─────────────────────────────────────────────────
      desktop:
        description: "Desktop environment (used only when tier != cli)"
        required: true
        type: choice
        options:
          - gnome
          - xfce
          - kde-plasma
          - mate
          - cinnamon
        default: gnome
      build_mode:
        description: "Build mode (full = kernel+uboot+rootfs+image)"
        required: true
        type: choice
        options:
          - full
          - minimal
        default: full
      extension_ref:
        description: "seeed_armbian_extension ref (branch:x / tag:x / commit:sha)"
        required: true
        type: string
        default: "branch:main"
      clear_kernel_cache:
        description: "Clear kernel deb/worktree cache before build"
        required: false
        type: boolean
        default: false
      publish_release:
        description: "Publish ONE GitHub Release covering all boards (IMAGES tables link OneDrive)"
        required: false
        type: boolean
        default: false
      release_tag_suffix:
        description: "Release tag suffix (auto: v{YYYYMMDD-HHMM} if empty)"
        required: false
        type: string
        default: ""
      upload_onedrive:
        description: "Upload images to OneDrive (seeed-storage:armbian-images/<board>/pre-release/)"
        required: false
        type: boolean
        default: true

env:
  PRIVATE_CCACHE: "yes"
  USE_CCACHE: "yes"
  ENABLE_SEEED_RK_EXTENSION: "yes"
  KERNEL_CONFIGURE: "no"
  VENDOR: "Armbian"
  DOCKER_IMAGE: "ghcr.io/armbian/docker-armbian-build:armbian-ubuntu-noble-latest"

jobs:
  preflight:
    # Fail fast on missing/invalid credentials BEFORE the multi-hour
    # build: previously a missing secret only surfaced at the step that
    # consumed it (OneDrive upload / release = 2h+ wasted).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets for the selected options
        env:
          SECURE_BOOT: ${{ inputs.secure_boot }}
          UPLOAD_ONEDRIVE: ${{ inputs.upload_onedrive }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          PRIVATE_KEY_PEM: ${{ secrets.PRIVATE_KEY_PEM }}
          DEV_CRT: ${{ secrets.DEV_CRT }}
          CRYPTROOT_PASSPHRASE: ${{ secrets.CRYPTROOT_PASSPHRASE }}
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
          ARMBIAN_BUILD_RELEASE_TOKEN: ${{ secrets.ARMBIAN_BUILD_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          fail=0
          err() { echo "::error::$1"; fail=1; }

          if [ "$SECURE_BOOT" = "true" ]; then
            [ -n "$PRIVATE_KEY_PEM" ] || err "secret PRIVATE_KEY_PEM is empty (secure_boot selected)"
            [ -n "$DEV_CRT" ]        || err "secret DEV_CRT is empty (secure_boot selected)"
            [ "${#CRYPTROOT_PASSPHRASE}" -eq 64 ] \
              || err "CRYPTROOT_PASSPHRASE must be exactly 64 chars, got ${#CRYPTROOT_PASSPHRASE}"
            if [ -n "$PRIVATE_KEY_PEM" ]; then
              printf '%s\n' "$PRIVATE_KEY_PEM" | openssl rsa -check -noout >/dev/null 2>&1 \
                || err "PRIVATE_KEY_PEM is not a parsable RSA key"
            fi
            if [ -n "$DEV_CRT" ]; then
              printf '%s\n' "$DEV_CRT" | openssl x509 -noout >/dev/null 2>&1 \
                || err "DEV_CRT is not a parsable x509 certificate"
            fi
            if [ -n "$PRIVATE_KEY_PEM" ] && [ -n "$DEV_CRT" ]; then
              key_pub=$(printf '%s\n' "$PRIVATE_KEY_PEM" | openssl rsa -pubout 2>/dev/null | openssl md5)
              crt_pub=$(printf '%s\n' "$DEV_CRT" | openssl x509 -pubkey -noout 2>/dev/null | openssl md5)
              [ "$key_pub" = "$crt_pub" ] || err "PRIVATE_KEY_PEM does not match DEV_CRT"
            fi
          fi

          if [ "$UPLOAD_ONEDRIVE" = "true" ]; then
            [ -n "$RCLONE_CONFIG" ] || err "secret RCLONE_CONFIG is empty (upload_onedrive selected)"
          fi

          if [ "$PUBLISH_RELEASE" = "true" ]; then
            [ -n "$ARMBIAN_BUILD_RELEASE_TOKEN" ] \
              || err "secret ARMBIAN_BUILD_RELEASE_TOKEN is empty (publish_release selected)"
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "All required secrets present and well-formed."

      - name: Probe OneDrive remote (catches expired rclone token)
        if: ${{ inputs.upload_onedrive }}
        uses: AnimMouse/setup-rclone@v1
        with:
          version: v1.67.0
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
          disable_base64: true

      - name: Verify rclone remote is writable
        if: ${{ inputs.upload_onedrive }}
        run: |
          set -euo pipefail
          rclone mkdir seeed-storage:armbian-images
          rclone lsd seeed-storage:armbian-images

      - name: Verify release token can reach target repo
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.ARMBIAN_BUILD_RELEASE_TOKEN }}
        run: gh api repos/Seeed-Studio/armbian-build --jq .full_name

  plan:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      boards: ${{ steps.gen.outputs.boards }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - name: Generate matrix JSON from checkbox inputs
        id: gen
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, itertools

          def flag(name):
              v = os.environ.get(name, "false").strip().lower()
              return v in ("true", "1", "yes", "on")

          # Boards
          boards = []
          if flag("BOARD_RK3576"): boards.append("recomputer-rk3576-devkit")
          if flag("BOARD_RK3588"): boards.append("recomputer-rk3588-devkit")

          # Releases
          releases = []
          if flag("REL_TRIXIE"): releases.append("trixie")
          if flag("REL_RESOLUTE"): releases.append("resolute")

          # Tiers
          tiers = []
          if flag("TIER_CLI"): tiers.append("cli")
          if flag("TIER_MID"):  tiers.append("mid")

          # OTA modes. Each selected mode becomes its own matrix entry.
          # If none selected, fall back to recovery — plain (no OTA)
          # images are no longer produced; seeed-build.sh also defaults
          # to recovery.
          otas = []
          if flag("OTA_RECOVERY"): otas.append("recovery")
          if flag("OTA_AB"):       otas.append("ab")
          if not otas:
              otas = ["recovery"]

          # Security profiles. Each checked option becomes its own matrix
          # dimension — plain and secure-boot can be built in one run.
          # If none checked, default to plain only.
          securities = []
          if flag("SEC_PLAIN"):    securities.append("")
          if flag("SECURE_BOOT"):  securities.append("secure-boot")
          if not securities:
              securities = [""]  # unencrypted only

          errs = []
          if not boards:   errs.append("select at least one board")
          if not releases: errs.append("select at least one release")
          if not tiers:    errs.append("select at least one tier")
          if errs:
              raise SystemExit("ERROR: " + "; ".join(errs))

          entries = []
          for (b, r, t, p, s) in itertools.product(boards, releases, tiers, otas, securities):
              entries.append({
                  "board": b,
                  "release": r,
                  "tier": t,
                  "profile": p,
                  "security": s,
              })

          print(f"::group::Matrix entries ({len(entries)})")
          for e in entries:
              print(f"  board={e['board']:<28} release={e['release']:<10} tier={e['tier']:<8} profile={e['profile'] or '(none)'} security={e['security'] or '(none)'}")
          print("::endgroup::")

          boards_unique = list(dict.fromkeys(boards))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': entries})}\n")
              f.write(f"boards={json.dumps(boards_unique)}\n")
              f.write(f"count={len(entries)}\n")
          PY
        env:
          BOARD_RK3576: ${{ inputs.board_rk3576 }}
          BOARD_RK3588: ${{ inputs.board_rk3588 }}
          REL_TRIXIE:   ${{ inputs.release_trixie }}
          REL_RESOLUTE:  ${{ inputs.release_resolute }}
          TIER_CLI:     ${{ inputs.tier_cli }}
          TIER_MID:     ${{ inputs.tier_mid }}
          OTA_RECOVERY: ${{ inputs.ota_recovery }}
          OTA_AB:       ${{ inputs.ota_ab }}
          SEC_PLAIN:    ${{ inputs.security_plain }}
          SECURE_BOOT:  ${{ inputs.secure_boot }}

      - name: Print summary
        run: |
          echo "Total matrix entries: ${{ steps.gen.outputs.count }}"
          echo "Boards to release: ${{ steps.gen.outputs.boards }}"

  build:
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # plan emits a dict like {"include": [...entries...]}, so we
        # pull the .include out — without it the field becomes
        # include: {"include": [...]}, which silently skips the job.
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}

    steps:
      # extension_ref is in fetch_from_repo's 方式:参数 format
      # (branch:x / tag:x / commit:sha); actions/checkout wants the bare
      # ref, so strip the prefix.
      - name: Resolve extension ref
        id: ext
        run: |
          ref='${{ inputs.extension_ref }}'
          echo "bare=${ref#*:}" >> "$GITHUB_OUTPUT"

      # The workflow file lives on seeed-build, but the code to build may
      # be on a different ref (branch:main-pre, ...) — check that out
      # directly instead of the dispatch ref.
      - name: Checkout extension at extension_ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ext.outputs.bare }}
          fetch-depth: 1

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                     /usr/local/share/boost /usr/local/share/openssl
          sudo apt-get purge -y --auto-remove \
                     'ghc-*' 'dotnet-*' 'llvm-*' 'azure-cli*' \
                     'firefox*' 'google-chrome*' 'powershell*' 'snapd' || true
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          docker system prune -af --volumes || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Install qemu-user-binfmt for cross-arch rootfs chroot
        # armbian's prepare_host_binfmt_qemu() runs `update-binfmts
        # --enable qemu-arm/qemu-aarch64/...` inside the docker
        # container to chroot into the arm64 rootfs on this x86_64
        # host. That only works if qemu interpreters are registered
        # on the host with the fix-binary (F) flag, which propagates
        # registrations into containers. On Ubuntu 26.04 the real
        # package is qemu-user-binfmt (qemu-user-static is a virtual
        # package with no candidate). Installing qemu-user-binfmt +
        # binfmt-support registers all foreign arches via postinst
        # with the F flag — no manual update-binfmts call needed.
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-binfmt binfmt-support
          echo "=== binfmt_misc registrations (host) ==="
          ls /proc/sys/fs/binfmt_misc/ || true
          echo "=== qemu-aarch64 entry ==="
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64 2>/dev/null || echo "qemu-aarch64 not registered"

      - name: Resolve matrix labels
        id: lbl
        run: |
          # Short board name for labels/artifacts (recomputer-rk3576-devkit -> rk3576)
          short=$(echo "${{ matrix.board }}" | sed -E 's/recomputer-//; s/-devkit//')
          ota="${{ matrix.profile }}"
          sec="${{ matrix.security }}"
          [ -z "$sec" ] && sec="nosec"
          echo "short_board=$short" >> "$GITHUB_OUTPUT"
          echo "ota_label=$ota" >> "$GITHUB_OUTPUT"
          echo "sec_label=$sec" >> "$GITHUB_OUTPUT"

      - name: Checkout armbian-build
        uses: actions/checkout@v4
        with:
          repository: Seeed-Studio/armbian-build
          ref: main
          path: armbian-build
          fetch-depth: 1

      - name: Point extension wrapper at the selected ref
        # Replace the pinned SEEED_EXTENSION_REF in
        # extensions/seeed-extension.sh with the selected ref; the
        # wrapper then fetches/symlinks/enables exactly that revision.
        run: |
          cd armbian-build
          sed -i "s|^SEEED_EXTENSION_REF=.*|SEEED_EXTENSION_REF=\"${{ inputs.extension_ref }}\"|" \
              extensions/seeed-extension.sh
          grep -n 'SEEED_EXTENSION_REF' extensions/seeed-extension.sh

      - name: Add trailing blank line to vendor defconfigs
        run: |
          cd armbian-build
          for f in patch/u-boot/legacy/u-boot-radxa-rk35xx/defconfig/recomputer-rk35{76,88}-devkit_defconfig; do
            [[ -f "$f" ]] || continue
            echo "" >> "$f"
            echo "Added trailing blank line to $f"
          done

      - name: Patch armbian docker.sh to forward CRYPTROOT_PASSPHRASE
        run: |
          cd armbian-build
          sed -i '/"--env" "ARMBIAN_RUNNING_IN_CONTAINER=yes"/a\\t\t"--env" "CRYPTROOT_PASSPHRASE=${CRYPTROOT_PASSPHRASE:-}"' \
              lib/functions/host/docker.sh
          echo "=== CRYPTROOT_PASSPHRASE forwarding in docker.sh ==="
          grep -n 'CRYPTROOT_PASSPHRASE' lib/functions/host/docker.sh

      - name: Patch radxa-aic8800 extension against GitHub API flakiness
        # api.github.com is flaky on CI runners; when the releases/latest lookup
        # fails, upstream resolves the version to "null" and wget 404s (run
        # 35177119171). The patch adds version pin/cache/fallback and
        # download-fallback-to-cache. git apply fails loudly if armbian-build
        # updates the extension, so the patch is never silently skipped.
        run: |
          cd armbian-build
          git apply "${GITHUB_WORKSPACE}/.github/patchs/radxa-aic8800.sh.patch"
          echo "=== patched radxa-aic8800.sh ==="
          grep -n "AIC8800_FALLBACK_VERSION\|aic8800_download_file_with_cache" extensions/radxa-aic8800.sh | head -5

      - name: Pre-create rkbin symlink for A/B OTA
        if: ${{ matrix.profile == 'ab' }}
        run: |
          cd armbian-build
          mkdir -p cache/sources/u-boot-worktree/u-boot-rockchip64
          ln -sfn ../../rkbin-tools cache/sources/u-boot-worktree/u-boot-rockchip64/rkbin
          echo "=== rkbin symlink ==="
          ls -la cache/sources/u-boot-worktree/u-boot-rockchip64/

      - name: Place FIT signing keys for secure profiles
        if: ${{ matrix.security == 'secure-boot' }}
        run: |
          set -euo pipefail
          cd armbian-build
          mkdir -p cache/sources/fit-keys
          printf '%s\n' "${PRIVATE_KEY_PEM}" > cache/sources/fit-keys/private_key.pem
          printf '%s\n' "${DEV_CRT}" > cache/sources/fit-keys/dev.crt
          chmod 0600 cache/sources/fit-keys/private_key.pem
          chmod 0644 cache/sources/fit-keys/dev.crt
          echo "=== FIT keys placed at cache/sources/fit-keys ==="
          ls -la cache/sources/fit-keys/
          echo "=== Key sanity check ==="
          openssl rsa -in cache/sources/fit-keys/private_key.pem -check -noout 2>&1 || true
          openssl x509 -in cache/sources/fit-keys/dev.crt -noout -subject 2>&1 || true
        env:
          PRIVATE_KEY_PEM: ${{ secrets.PRIVATE_KEY_PEM }}
          DEV_CRT: ${{ secrets.DEV_CRT }}

      - name: Symlink build.sh into armbian-build root
        run: |
          ln -sf "$GITHUB_WORKSPACE/scripts/build.sh" armbian-build/seeed-build.sh
          ls -la armbian-build/seeed-build.sh

      - name: Restore docker image cache
        uses: actions/cache@v4
        id: docker_cache
        with:
          path: /tmp/armbian-docker-image.tar.zst
          key: docker-armbian-ubuntu-noble-latest-v1
        continue-on-error: true

      - name: Load cached docker image
        if: steps.docker_cache.outputs.cache-hit == 'true'
        run: |
          if [ -f /tmp/armbian-docker-image.tar.zst ]; then
            echo "Loading cached docker image..."
            zstd -d -T0 /tmp/armbian-docker-image.tar.zst -o /tmp/armbian-docker-image.tar
            docker load -i /tmp/armbian-docker-image.tar
            rm -f /tmp/armbian-docker-image.tar
            docker images | grep armbian
          fi

      - name: Pull docker image (if not cached)
        if: steps.docker_cache.outputs.cache-hit != 'true'
        run: |
          docker pull ${{ env.DOCKER_IMAGE }}
          # Save for next run. zstd is faster and smaller than gzip for this workload.
          docker save ${{ env.DOCKER_IMAGE }} | zstd -19 -T0 -o /tmp/armbian-docker-image.tar.zst
          ls -lh /tmp/armbian-docker-image.tar.zst

      - name: Restore armbian deb packages cache
        if: ${{ !inputs.clear_kernel_cache }}
        uses: actions/cache@v4
        with:
          path: |
            armbian-build/output/debs
            armbian-build/output/packages-hashed
          key: debs-arm64-${{ matrix.board }}-vendor-${{ hashFiles('armbian-build/config/sources/families/seeed-rk*.conf', 'armbian-build/config/sources/families/rk35xx.conf', 'armbian-build/config/sources/vendors/seeed-studio/*.inc') }}
          restore-keys: |
            debs-arm64-${{ matrix.board }}-vendor-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: armbian-build/cache/ccache
          key: ccache-arm64-${{ matrix.board }}-vendor-${{ github.sha }}
          restore-keys: |
            ccache-arm64-${{ matrix.board }}-vendor-
            ccache-arm64-${{ matrix.board }}-

      # rootfs cache intentionally disabled: each entry is ~2 GiB and
      # with several release+tier combos would blow GitHub's 10 GiB repo
      # cache limit, evicting the kernel deb cache (forcing 30+ min
      # rebuilds). Rootfs from scratch is only ~10 min — not worth it.

      - name: Build
        working-directory: armbian-build
        run: |
          set -euo pipefail
          MODE_ARGS=""
          case "${{ inputs.build_mode }}" in
            minimal) MODE_ARGS="--minimal" ;;
            full)    MODE_ARGS="" ;;
          esac

          TIER_ARGS=""
          if [[ "${{ matrix.tier }}" == "cli" ]]; then
              TIER_ARGS="--minimal"
          else
              TIER_ARGS="-d ${{ inputs.desktop }} -t ${{ matrix.tier }}"
          fi

          # Passphrase is only consumed when a security profile is set
          # (append_security_args gates CRYPTROOT_ENABLE on it).
          # Presence and the 64-char length are preflight-validated, so
          # no fallback here — a missing secret must fail loudly.
          if [[ -n "${{ matrix.security }}" ]]; then
              export CRYPTROOT_PASSPHRASE="${{ secrets.CRYPTROOT_PASSPHRASE }}"
          fi

          if [[ -d cache/sources/fit-keys ]]; then
              export UBOOT_FIT_KEYS_BACKUP_DIR="/armbian/cache/sources/fit-keys"
          fi

          # shellcheck disable=SC2086
          ./seeed-build.sh \
            $MODE_ARGS \
            ${{ matrix.profile }} \
            ${{ matrix.security }} \
            -b "${{ matrix.board }}" \
            -R "${{ matrix.release }}" \
            $TIER_ARGS \
            ${{ inputs.clear_kernel_cache && '-c' || '' }}

      - name: Compress .img to .img.xz + sha256
        if: always()
        working-directory: armbian-build
        run: |
          set -euo pipefail
          shopt -s nullglob
          for img in output/images/*.img; do
            base="$(basename "$img" .img).img.xz"
            echo "Compressing $img -> output/images/$base"
            xz -T0 -6 -v < "$img" > "output/images/$base"
            # Generate sha256 of the compressed file; keep armbian's
            # own .img.sha too so users can verify after `xz -d`
            # against the unpacked img.
            ( cd output/images && sha256sum "$base" > "$base.sha256" )
            echo "Removing uncompressed $img"
            rm -f "$img"
          done
          echo "=== output/images/ contents ==="
          ls -lh output/images/

      - name: Setup Rclone
        if: ${{ inputs.upload_onedrive }}
        uses: AnimMouse/setup-rclone@v1
        with:
          version: v1.67.0
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
          disable_base64: true

      - name: Upload images to OneDrive (pre-release)
        # OneDrive layout (seeed-storage:armbian-images/<board>/pre-release/):
        #   rec/ | ab/              — images without security profile
        #   "rec sec/" | "ab sec/"  — secure-boot images
        #   fit/ inside sec dirs is NOT touched by CI — signed FIT images
        #   are uploaded manually.
        # No CI-side filename renaming: the extension already bakes the
        # OTA mode into the image name (RECOVERY / AB_PART) and the
        # directory layout carries the rest.
        # The release/ channel is also manual: tested images are moved
        # from pre-release by hand. Retention: the cleanup job deletes
        # pre-release files from previous runs after the matrix
        # finishes (only this run's uploads stay).
        if: ${{ inputs.upload_onedrive }}
        working-directory: armbian-build
        run: |
          set -euo pipefail
          BOARD_DIR="${{ steps.lbl.outputs.short_board }}-devkit"
          case "${{ matrix.profile }}" in
            ab)       OTA_DIR="ab" ;;
            recovery) OTA_DIR="rec" ;;
            *)        OTA_DIR="rec" ;;
          esac
          if [ -n "${{ matrix.security }}" ]; then
            DEST="seeed-storage:armbian-images/${BOARD_DIR}/pre-release/${OTA_DIR} sec"
          else
            DEST="seeed-storage:armbian-images/${BOARD_DIR}/pre-release/${OTA_DIR}"
          fi
          echo "Uploading output/images/ -> ${DEST}"
          rclone copy -P --stats 1m output/images/ "${DEST}"
          echo "=== Remote listing ==="
          rclone lsl "${DEST}"

      - name: Upload output/images/ as-is
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-img-${{ steps.lbl.outputs.short_board }}-${{ matrix.release }}-${{ matrix.tier }}-${{ steps.lbl.outputs.ota_label }}-${{ steps.lbl.outputs.sec_label }}-${{ github.run_id }}
          path: armbian-build/output/images/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Print ccache stats
        if: always()
        run: |
          command -v ccache >/dev/null 2>&1 || { echo "ccache not installed on host; install with: sudo apt-get install -y ccache"; exit 0; }
          ccache -s 2>/dev/null || true
          du -sh armbian-build/cache/ccache 2>/dev/null || true

  cleanup:
    name: OneDrive retention (${{ matrix.board }})
    needs: [plan, build]
    # Retention: pre-release keeps ONLY what this run uploaded — files
    # from previous runs are deleted. This must run after the whole
    # matrix, not inside build entries: parallel entries sharing a
    # directory (e.g. trixie + resolute both landing in rec/) would
    # delete each other's fresh uploads. Only on full build success, so
    # a partially-failed run leaves the previous images in place.
    if: ${{ inputs.upload_onedrive && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.plan.outputs.boards) }}

    steps:
      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          version: v1.67.0
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
          disable_base64: true

      - name: Delete pre-release files older than this run
        # Deletes direct-child files whose modtime predates this run
        # (= previous runs' leftovers). --max-depth 1 keeps it
        # non-recursive, so fit/ (manual signed FIT uploads) is never
        # touched. release/, uboot/ are not scanned at all.
        env:
          RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          set -euo pipefail
          AGE=$(( $(date +%s) - $(date -u -d "${RUN_STARTED_AT}" +%s) ))
          if [ "$AGE" -le 0 ]; then
            echo "::error::computed age ${AGE}s is not positive (clock skew?); refusing to delete anything"
            exit 1
          fi
          short=$(echo "${{ matrix.board }}" | sed -E 's/recomputer-//; s/-devkit//')
          BASE="seeed-storage:armbian-images/${short}-devkit/pre-release"
          for d in "rec" "ab" "rec sec" "ab sec"; do
            echo "=== ${BASE}/${d}: before ==="
            rclone lsl "${BASE}/${d}" 2>/dev/null || true
            echo "=== deleting files older than $(( AGE / 60 )) min ==="
            rclone delete "${BASE}/${d}" --min-age "${AGE}s" --max-depth 1 -v || true
            echo "=== after ==="
            rclone lsl "${BASE}/${d}" 2>/dev/null || true
          done

  release:
    needs: [plan, build, cleanup]
    # ONE release covering ALL boards. Body = Note (IMAGE/OTA one-liners)
    # + IMAGES with one table per board — the hand-tuned format from
    # v20260901-0433-rk3576. Links are generated live from the OneDrive
    # listing after retention cleanup, so they always match what is
    # published. No repo checkout needed: everything comes from OneDrive.
    if: ${{ inputs.publish_release && inputs.upload_onedrive && !cancelled() && needs.build.result == 'success' && needs.cleanup.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # No permissions: block — release targets Seeed-Studio/armbian-build,
    # which the default GITHUB_TOKEN cannot write to. The PAT in
    # ARMBIAN_BUILD_RELEASE_TOKEN is the real authorization.
    steps:
      - name: Resolve tag
        id: tag
        run: |
          suffix="${{ inputs.release_tag_suffix }}"
          if [ -n "$suffix" ]; then
            tag="v${suffix}"
          else
            tag="v$(date -u +%Y%m%d-%H%M)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          version: v1.67.0
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
          disable_base64: true

      # Each row pairs an .img.xz with its _OTA.tar.gz (matched by
      # filename stem) and links both via rclone share links; the Type
      # column comes from the OneDrive directory (rec/ab/sec).
      - name: Generate release document from OneDrive listing
        env:
          BOARDS: ${{ needs.plan.outputs.boards }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import datetime, json, os, re, subprocess

          boards = json.loads(os.environ["BOARDS"])

          DISTRO = {
              "trixie":   ("https://armbian.com/debian.svg", "Debian 13"),
              "resolute": ("https://armbian.com/ubuntu.png", "Ubuntu 26.04"),
              "plucky":   ("https://armbian.com/ubuntu.png", "Ubuntu 25.04"),
          }
          VARIANT = {
              "gnome_desktop": "Gnome",
              "minimal":       "Minimal (CLI)",
          }

          def lsjson(directory):
              r = subprocess.run(["rclone", "lsjson", directory],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"::warning::lsjson failed for {directory}: {r.stderr.strip()}")
                  return {}
              return {e["Name"]: e.get("Size", 0) for e in json.loads(r.stdout)
                      if not e.get("IsDir", False)}

          def link(path):
              r = subprocess.run(["rclone", "link", path],
                                 capture_output=True, text=True)
              if r.returncode != 0 or not r.stdout.strip():
                  print(f"::warning::link failed for {path}: {r.stderr.strip()}")
                  return ""
              return r.stdout.strip()

          refs = []

          def ref(url):
              refs.append(url)
              return len(refs)

          def human(n):
              g = n / 1_000_000_000
              if g >= 1:
                  return f"{g:.1f}GB"
              return f"{n / 1_000_000:.0f}MB"

          DIRS = (("rec", "RECOVERY"), ("ab", "AB"),
                  ("rec sec", "RECOVERY-SEC"), ("ab sec", "AB-SEC"))

          def board_table(board):
              short = board.replace("recomputer-", "").replace("-devkit", "")
              rows = []
              for sub, typ in DIRS:
                  d = f"seeed-storage:armbian-images/{short}-devkit/pre-release/{sub}"
                  files = lsjson(d)
                  for name in sorted(files):
                      if not name.endswith(".img.xz"):
                          continue
                      stem = name[: -len(".img.xz")]
                      # ..._<release>_vendor_<ver>_<variant>_<RECOVERY|AB_PART>
                      m = re.search(r"_([a-z]+)_vendor_[0-9.]+_(.*)_(RECOVERY|AB_PART)$", stem)
                      if not m:
                          print(f"::warning::unparsed filename {name}")
                          continue
                      rel, var = m.group(1), m.group(2)
                      icon, dist = DISTRO.get(rel, ("", rel))
                      var_txt = VARIANT.get(var, var.replace("_desktop", "").title())
                      img_i = ref(link(f"{d}/{name}"))
                      cell = f"[IMAGE][{img_i}]"
                      ota = stem + "_OTA.tar.gz"
                      if ota in files:
                          ota_i = ref(link(f"{d}/{ota}"))
                          cell = f"[IMAGE][{img_i}] \\| [OTA][{ota_i}]"
                      rows.append(f'|<img src="{icon}" width="20" height="20"> '
                                  f'<span>{dist}</span>|{var_txt}|{typ}|{human(files[name])}|{cell} |')
              head = ["|Distribution|Variant|Type|Size|Download|",
                      "|:-:         |:-:    |:-: |:-: |:-:     |"]
              return head + sorted(rows)

          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          out = [
              "## Armbian images — pre-release", "",
              f"Built from CI run {os.environ.get('GITHUB_RUN_ID', '')} on {today}. "
              "Hosted on OneDrive; pre-release keeps only the latest CI run.", "",
              "### Note", "",
              "**IMAGE**: xz-compressed system image — verify with the matching `.sha256` sidecar on OneDrive",
              "**OTA**: full-system OTA update payload for the paired image", "",
              "### IMAGES", "",
          ]
          for b in boards:
              short = b.replace("recomputer-", "").replace("-devkit", "")
              out += [f"#### {short}-devkit", ""] + board_table(b) + [""]
          for i, url in enumerate(refs, 1):
              out.append(f"[{i}]:{url}")

          md = "\n".join(out)
          os.makedirs("release-out", exist_ok=True)
          with open("release-out/CHANGELOG.md", "w", encoding="utf-8") as f:
              f.write(md + "\n")
          print("=== Generated release-out/CHANGELOG.md ===")
          print(md)
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: Seeed-Studio/armbian-build
          target_commitish: main
          token: ${{ secrets.ARMBIAN_BUILD_RELEASE_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          # Body renders the same document that is attached as the sole
          # asset (asset name is the basename: CHANGELOG.md).
          body_path: release-out/CHANGELOG.md
          files: release-out/CHANGELOG.md
          fail_on_unmatched_files: true
          generate_release_notes: false
