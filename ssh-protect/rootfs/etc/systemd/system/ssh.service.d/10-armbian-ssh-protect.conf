# Recover from power-loss corruption (zero-filled or truncated sshd_config /
# host keys) before sshd starts. Without the leading empty ExecStartPre= the
# base unit's own `sshd -t` would run first and abort on the broken config
# before ssh-protect gets a chance to repair it.
[Service]
ExecStartPre=
ExecStartPre=/usr/lib/armbian/ssh-protect
ExecStartPre=/usr/sbin/sshd -t
